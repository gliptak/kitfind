name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Build and validate
        run: uv sync --all-extras && uv run tools/build.py && uv run python tools/validate.py --all
      - name: Type check
        run: uv run mypy tools/build.py tools/validate.py
      - name: JS tests
        run: node --test tools/tests/search.test.mjs
      - name: Template JS syntax
        run: uv run python tools/validate.py --html
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/

  preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/preview.yml
    permissions:
      contents: write
      pull-requests: write
