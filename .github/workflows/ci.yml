name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Build and validate
        run: uv sync --all-extras && uv run tools/build.py && uv run python tools/validate.py --all
      - name: Type check
        run: uv run mypy tools/build.py tools/validate.py
      - name: JS tests
        run: node --test tools/tests/search.test.mjs
      - name: Template JS syntax
        run: uv run python tools/validate.py --html
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
