name: Preview

on:
  workflow_run:
    workflows: [CI, PR Closed]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    # After a successful CI run for a same-repo PR; never for forks
    if: >-
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          action: deploy
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          source-dir: ./site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          comment: true

  cleanup:
    # CI does not run on PR close, so the PR Closed workflow signals it
    if: >-
      github.event.workflow_run.name == 'PR Closed' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          action: remove
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          comment: true
